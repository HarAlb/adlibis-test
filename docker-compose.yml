version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: adlibis_laravel_app
        volumes:
            - .:/var/www/adlibis-test
            - ./docker/php/php.ini:/usr/local/etc/php/php.ini
        depends_on:
            - db
        networks:
            - laravel
        extra_hosts:
            - "host.docker.internal:host-gateway"
    nginx:
        image: nginx:alpine
        container_name: adlibis_nginx
        restart: unless-stopped
        tty: true
        volumes:
            - .:/var/www/adlibis-test
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "80:80"
        networks:
            - laravel
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: adlibis_mysql_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: highload_laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysqldata:/var/lib/mysql
        networks:
            - laravel
        command: >
            --default-authentication-plugin=mysql_native_password
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
            --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION

    redis:
        image: redis:alpine
        container_name: adlibis_redis
        ports:
            - "6379:6379"
        networks:
            - laravel

volumes:
    mysqldata:

networks:
    laravel:
        driver: bridge
