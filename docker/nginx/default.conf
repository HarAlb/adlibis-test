server {
    listen 80;
    server_name adlibis-test-app.test;

    root /var/www/adlibis-test/public;
    index index.php;

    client_max_body_size 100M;

    charset utf-8;

    location ^~ /docs/asset/ {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_pass adlibis_laravel_app:9000;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(storage|vendor|\.env|\.git|composer\.(json|lock)) {
        deny all;
    }
}
